# Log a bet you placed, from your phone: GitHub app > Actions > Log a bet > Run workflow.
# Records it with price_sheet.py --log-bet (never places anything), refreshes reports/latest.md,
# pushes, and confirms on your phone.
# Two jobs, so no bet is lost when runs overlap (agent/bet_queue.py): "queue" commits the bet as a file under
# data/bet_queue/ straight away; "log" waits for the cards-db group and logs every queued bet. GitHub cancels a
# waiting run when a newer one arrives; the newer run then logs both bets.
name: Log a bet

on:
  workflow_dispatch:
    inputs:
      bet:
        description: 'Bet, e.g. "Arsenal v Leeds: Leeds over 1.5 @ 2.10 Sky Bet £10" or the research line with your odds and stake'
        required: true
        type: string
      placed:
        description: 'Only if the match has kicked off: when you placed it, UK time "YYYY-MM-DD HH:MM"'
        required: false
        type: string
      adjusted_p:
        description: "Optional: your research-adjusted probability (0.45 or 45)"
        required: false
        type: string
      reason:
        description: "Optional: why you adjusted it"
        required: false
        type: string

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Queue the bet
        env:
          BET: ${{ inputs.bet }}
          PLACED: ${{ inputs.placed }}
          ADJ: ${{ inputs.adjusted_p }}
          REASON: ${{ inputs.reason }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 agent/bet_queue.py add data/bet_queue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bet_queue
          git commit -q -m "Queue bet: ${BET:0:100}"
          for i in 1 2 3 4 5; do   # only adds a new file, so a rebase onto other runs' pushes can't conflict
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((10 * i))
          done
          exit 1

      - name: Alert if the bet couldn't be queued
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BET: ${{ inputs.bet }}
        run: agent/notify.sh "Bet NOT logged" "$BET could not be queued. See the Actions tab and send it again."

  log:
    needs: queue
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 20
    concurrency:
      group: cards-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Anything queued?
        id: queue
        run: echo "count=$(ls data/bet_queue/*.json 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.queue.outputs.count != '0'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.queue.outputs.count != '0'
        run: |
          pip install -q -r requirements.txt
          for i in 1 2 3; do   # Ubuntu's package mirrors sometimes drop out for a few minutes
            python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "browser install failed, retry $i in $((60 * i))s"; sleep $((60 * i)); sudo apt-get update -q || true
          done

      - name: Load appointed referees
        if: steps.queue.outputs.count != '0'
        continue-on-error: true   # if a feed is down the bet is still logged, priced as provisional
        run: |
          label=$(python -c "from datetime import date; d=date.today(); y=d.year if d.month>=8 else d.year-1; print(f'{y}-{str(y+1)[2:]}')")
          python collect_cards.py --db cards.db --season "$label" --referees-only

      - name: Log the queued bets
        if: steps.queue.outputs.count != '0'
        run: python agent/bet_queue.py run data/bet_queue /tmp/logged.json cards.db | tee /tmp/logged.txt

      - name: Refresh dashboard
        if: steps.queue.outputs.count != '0'
        run: |
          python price_sheet.py --db cards.db --days 2 --json > /tmp/sheet.json
          python agent/health.py cards.db > /tmp/health.txt   # keep the data-problem warning on the page
          python agent/dashboard.py /tmp/sheet.json cards.db /tmp/health.txt > reports/latest.md

      - name: Commit and push
        if: steps.queue.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.db reports/latest.md
          git add -A data/bet_queue
          git commit -q -m "Log bets: $(grep -c '^LOGGED' /tmp/logged.txt) logged, $(grep -c '^NOT LOGGED' /tmp/logged.txt) rejected"
          for i in 1 2 3 4 5; do   # other runs can only have added queue files meanwhile
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            [ "$i" = 5 ] && exit 1
            sleep $((10 * i))
          done
          { echo '```'; cat /tmp/logged.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm on phone
        if: always() && steps.queue.outputs.count != '0'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 agent/bet_queue.py notify /tmp/logged.json "${{ job.status }}"
