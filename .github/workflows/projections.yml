# Daily pre-kickoff projection log (Sunday to Friday; the Saturday run logs its own): updates fixtures,
# referees and 1X2 prices, appends the model's projection for every match in the next 2 days to
# data/projections.csv and pushes that file, plus cards.db when a bet settled (otherwise the Saturday run saves it).
# Score the log with: python agent/score_projections.py cards.db data/projections.csv
name: Projection log

on:
  schedule:
    - cron: "47 8 * * 0-5"   # 09:47 UK in summer, 08:47 in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards-db
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          for i in 1 2 3; do   # Ubuntu's package mirrors sometimes drop out for a few minutes
            python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "browser install failed, retry $i in $((60 * i))s"; sleep $((60 * i)); sudo apt-get update -q || true
          done

      - name: Season label
        id: season
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          from datetime import date
          d = date.today()
          y = d.year if d.month >= 8 else d.year - 1
          print(f"label={y}-{str(y + 1)[2:]}")
          print(f"day={d.isoformat()}")
          PY

      - name: Update fixtures
        run: |
          pending() { python -c "import sqlite3; print(sqlite3.connect('cards.db').execute(\"SELECT COUNT(*) FROM value_bets WHERE result = 'pending'\").fetchone()[0])"; }
          pending > /tmp/pending_before
          python collect_cards.py --db cards.db --season ${{ steps.season.outputs.label }} --no-cups
          pending > /tmp/pending_after

      - name: Log projections
        run: python agent/log_projections.py --db cards.db --days 2

      - name: Alert on bets the two card sources would settle differently
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python settle.py --db cards.db | grep '^CHECK' > /tmp/check.txt || true
          [ ! -s /tmp/check.txt ] || agent/notify.sh "Bet needs checking" "$(cat /tmp/check.txt)"

      - name: Commit and push the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projections.csv
          [ ! -f data/espn_cards.csv ] || git add data/espn_cards.csv   # ESPN's card counts: the settlement cross-check
          if ! cmp -s /tmp/pending_before /tmp/pending_after; then
            git add cards.db   # a bet settled: keep it (cards.db is otherwise only saved on Saturdays)
          fi
          git diff --cached --quiet || git commit -q -m "Projection log ${{ steps.season.outputs.day }}"
          git checkout -- . && git clean -fdq
          git pull -q --rebase origin main && git push -q origin HEAD:main
