# One-off: fill missing past referees from ESPN on a COPY of cards.db. Saves progress to the
# referee-backfill branch (data/referees_backfill.csv) after every league-season, and resumes from it,
# so re-running continues where the last run stopped. Never changes cards.db or main.
name: Backfill referees (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: referee-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 150   # short enough never to collide with the Saturday run; re-run to continue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          for i in 1 2 3; do   # Ubuntu's package mirrors sometimes drop out for a few minutes
            python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "browser install failed, retry $i in $((60 * i))s"; sleep $((60 * i)); sudo apt-get update -q || true
          done

      - name: Load earlier progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin referee-backfill
          git worktree add -q /tmp/bf origin/referee-backfill
          cp cards.db /tmp/refs.db
          python agent/backfill_referees.py apply /tmp/refs.db /tmp/bf/data/referees_backfill.csv

      - name: Backfill, saving after each league-season
        run: |
          pairs=""
          for s in 2025-26 2024-25 2023-24 2022-23 2021-22; do
            for l in LALIGA SERIEA BUNDES LIGUE1; do pairs="$pairs $l:$s"; done
          done
          cd /tmp/bf && git checkout -q -B referee-backfill && cd -
          for p in $pairs; do
            echo "::group::$p"
            timeout 25m python agent/backfill_referees.py fill /tmp/refs.db "$p" 2>&1 | grep -v " HTTP " | tail -5 || true
            python agent/backfill_referees.py export /tmp/refs.db /tmp/bf/data/referees_backfill.csv $pairs
            cd /tmp/bf
            git add data/referees_backfill.csv
            if ! git diff --cached --quiet; then
              git commit -q -m "Referee backfill: $p ($(($(wc -l < data/referees_backfill.csv) - 1)) checked matches)"
              git push -q origin HEAD:referee-backfill
            fi
            cd - > /dev/null
            echo "::endgroup::"
          done
