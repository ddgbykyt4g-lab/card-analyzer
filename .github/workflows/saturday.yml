# Free Saturday run (no Claude): update data, settle bets, price today's matches, save the sheet to
# reports/, push, then send the phone alert. Team-news research is left to you.
# Needs the repository secret NTFY_TOPIC (Settings > Secrets and variables > Actions).
name: Saturday price sheet

on:
  schedule:
    # GitHub started scheduled runs 6-8 hours late in Nov 2026 (13:32 and 14:39 on Saturdays), so four attempts
    # (UTC): Friday after the evening matches, then early Saturday. The first to start does the work for that
    # Saturday; the "due" job skips the rest (data/last_run/saturday). Saturday's referees are out by Friday.
    - cron: "47 22 * * 5"
    - cron: "17 1 * * 6"
    - cron: "17 3 * * 6"
    - cron: "17 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Outside the cards-db group, so a skipped attempt never queues there (a queued run there would replace a
  # waiting "Log a bet" run).
  due:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          sparse-checkout: data/last_run
      - id: check
        run: |
          # the Saturday this run is for: today on a Saturday, tomorrow on a Friday (UK dates)
          target=$(TZ=Europe/London date +%F -d "$( [ "$(TZ=Europe/London date +%u)" = 5 ] && echo tomorrow || echo today)")
          last=$(cat data/last_run/saturday 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$target" ]; then
            echo "Already ran for $target: skipping"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: due
    if: needs.due.outputs.run == 'true'
    concurrency:
      group: cards-db
      cancel-in-progress: false
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -q -r requirements.txt
          for i in 1 2 3; do   # Ubuntu's package mirrors sometimes drop out for a few minutes
            python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            echo "browser install failed, retry $i in $((60 * i))s"; sleep $((60 * i)); sudo apt-get update -q || true
          done

      - name: Season label
        id: season
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          uk = now.astimezone(ZoneInfo("Europe/London")).date()
          d = uk + timedelta(days=1) if uk.weekday() == 4 else uk   # a Friday run is for tomorrow
          y = d.year if d.month >= 8 else d.year - 1
          # cover the weekend to Monday 06:00 UTC, as a Saturday 06:17 run with --days 2 did
          monday = datetime.combine(d + timedelta(days=(7 - d.weekday()) % 7 or 7), datetime.min.time(),
                                    timezone.utc).replace(hour=6)
          print(f"label={y}-{str(y + 1)[2:]}")
          print(f"day={d.isoformat()}")
          print(f"days={max((monday - now).total_seconds() / 86400, 2):.2f}")
          PY

      - name: Collect data and settle bets
        run: |
          python collect_cards.py --db cards.db --season ${{ steps.season.outputs.label }} --no-cups 2>&1 | tee /tmp/collect.log
          python settle.py --db cards.db --report | tee /tmp/settle.txt

      - name: Log any queued bets (a waiting "Log a bet" run can be replaced by this one)
        run: |
          if ls data/bet_queue/*.json >/dev/null 2>&1; then
            python agent/bet_queue.py run data/bet_queue /tmp/logged.json cards.db | tee /tmp/logged.txt
          fi

      - name: Data health check
        if: always()
        run: python agent/health.py cards.db /tmp/collect.log | tee /tmp/health.txt

      - name: Price sheet
        run: |
          python price_sheet.py --db cards.db --days ${{ steps.season.outputs.days }} --json > /tmp/sheet.json
          day=${{ steps.season.outputs.day }}
          {
            echo "# Price sheet $day (automatic, no team-news research)"
            echo
            echo "Overs: take only at about +8-10% EV. Log what you bet with price_sheet.py --log-bet."
            echo
            echo '```'
            python price_sheet.py --db cards.db --days ${{ steps.season.outputs.days }}
            echo '```'
            echo
            echo "## Track record"
            echo
            echo '```'
            cat /tmp/settle.txt
            echo '```'
          } > "reports/$day-prices.md"

      - name: Log projections
        run: python agent/log_projections.py --db cards.db --days ${{ steps.season.outputs.days }}

      - name: Phone dashboard
        run: |
          python agent/dashboard.py /tmp/sheet.json cards.db /tmp/health.txt > reports/latest.md
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/last_run && echo "${{ steps.season.outputs.day }}" > data/last_run/saturday   # later attempts skip
          git add cards.db reports/ data/
          # queued bets logged above; once the queue is empty git drops the folder, and a bare pathspec would fail
          if [ -d data/bet_queue ] || git ls-files --error-unmatch data/bet_queue >/dev/null 2>&1; then git add -A data/bet_queue; fi
          git diff --cached --quiet || git commit -q -m "Saturday price sheet ${{ steps.season.outputs.day }}"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - name: Confirm queued bets
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: '[ ! -s /tmp/logged.json ] || python3 agent/bet_queue.py notify /tmp/logged.json "${{ job.status }}"'

      - name: Phone alert
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -s /tmp/sheet.json ]; then
            python agent/free_summary.py /tmp/sheet.json /tmp/settle.txt --day ${{ steps.season.outputs.day }} > /tmp/alert.txt
            python review/experiment_a.py remind --db cards.db --hours 48 > /tmp/remind.txt || true
            [ ! -s /tmp/remind.txt ] || { echo; cat /tmp/remind.txt; } >> /tmp/alert.txt
            if [ "$(cat /tmp/health.txt 2>/dev/null)" = "OK" ]; then
              agent/notify.sh "Cards ${{ steps.season.outputs.day }}" "$(cat /tmp/alert.txt)"
            else
              { cat /tmp/health.txt; echo "---"; cat /tmp/alert.txt; } > /tmp/body.txt
              agent/notify.sh "Cards ${{ steps.season.outputs.day }}: DATA PROBLEM, check first" "$(cat /tmp/body.txt)"
            fi
          else
            agent/notify.sh "Cards ${{ steps.season.outputs.day }}: run failed" "The Saturday run failed before pricing. See the Actions tab on GitHub."
          fi
