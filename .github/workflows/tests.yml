# Unit tests for the logic that touches money: bet parsing, odds/push maths, settlement, void rules.
name: Tests

on:
  push:
    paths: ["**.py", "card_value_schema.sql", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q tests
