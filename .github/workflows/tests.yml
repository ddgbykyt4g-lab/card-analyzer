# Unit tests for the logic that touches money: bet parsing, odds/push maths, settlement, void rules.
name: Tests

on:
  push:
    paths: ["**.py", "card_value_schema.sql", "requirements.txt", ".github/workflows/tests.yml"]
  # a pull request is checked on its whole diff, so one whose last commit only touches docs still gets a run
  pull_request:
    paths: ["**.py", "card_value_schema.sql", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q tests
