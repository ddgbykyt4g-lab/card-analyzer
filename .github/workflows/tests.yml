# Unit tests for the logic that touches money: bet parsing, odds/push maths, settlement, void rules.
name: Tests

on:
  push:
    paths: ["**.py", "card_value_schema.sql", "requirements.txt", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for 26.04 (ubuntu-latest since Oct 2026)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt pytest
      - run: python -m pytest -q tests
